<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    :root {
      --icon-fill: #09090B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --icon-fill: #FFFFFF;
      }
    }
    .f-top { fill: var(--icon-fill); }
    .f-left { fill: var(--icon-fill); opacity: 0.38; }
    .f-right { fill: var(--icon-fill); opacity: 0.78; }
  </style>

  <!-- 100% Transparent Background - Adaptive 3D Volume Cube -->
  <!-- Top Face (Black in Light Mode, White in Dark Mode) -->
  <polygon class="f-top" points="64,10 116,38 64,66 12,38" />

  <!-- Left Face (Shadow Facet) -->
  <polygon class="f-left" points="12,46 61,72 61,118 12,92" />

  <!-- Right Face (Mid-tone Facet) -->
  <polygon class="f-right" points="67,72 116,46 116,92 67,118" />
</svg>
