<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="fav-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="fav-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0075DE" />
      <stop offset="100%" stop-color="#0052A3" />
    </linearGradient>
    <linearGradient id="fav-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="fav-liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
  </defs>

  <!-- Clean rounded squircle container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />

  <!-- Volumetric 3D Prism centered (scale 1.8 from 64x64) -->
  <g transform="translate(6.4, 6.4) scale(1.8)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Face -->
    <polygon points="32,9 51,20 32,31 13,20" fill="url(#fav-top)" opacity="0.9" stroke="#0284C7" stroke-width="1.8" />
    <!-- Left Facet -->
    <polygon points="13,20 32,31 32,53 13,42" fill="url(#fav-left)" stroke="#0052A3" stroke-width="1.8" />
    <!-- Right Facet -->
    <polygon points="32,31 51,20 51,42 32,53" fill="url(#fav-right)" stroke="#0369A1" stroke-width="1.8" />
    <!-- Liquid Meniscus -->
    <polygon points="32,23 45,30.5 32,38 19,30.5" fill="url(#fav-liquid)" stroke="#38BDF8" stroke-width="1.2" />
    <!-- Measurement Ticks -->
    <line x1="29.5" y1="36" x2="34.5" y2="36" stroke="#FFFFFF" stroke-width="1.8" opacity="0.95" />
    <line x1="29" y1="41.5" x2="35" y2="41.5" stroke="#FFFFFF" stroke-width="2.2" />
    <line x1="29.5" y1="47" x2="34.5" y2="47" stroke="#FFFFFF" stroke-width="1.8" opacity="0.95" />
    <!-- Spine -->
    <line x1="32" y1="31" x2="32" y2="53" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4" />
    <!-- V Accent -->
    <polyline points="13,20 32,31 51,20" fill="none" stroke="#FFFFFF" stroke-width="2.4" opacity="0.8" />
  </g>
</svg>
